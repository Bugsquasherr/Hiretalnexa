<html lang="en">
<head>

<title>Hiretalnexa Tracker</title>

<style>
:root{--n:#0b1a33;--b:#1e40d8;--g:#0f9f7a;--bg:#f4f6fb;--line:#e1e6f0;--t:#17233b;--m:#5b677d;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px}
[hidden]{display:none!important}
.bt{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--b);color:#fff;white-space:nowrap}
.bt:hover{filter:brightness(1.1)}.bt:disabled{opacity:.5;cursor:not-allowed}
.bt.ghost{background:#fff;color:var(--t);border:1px solid var(--line)}
.bt.red{background:#fff;color:#b42318;border:1px solid #f1c3be}
.bt.sm{padding:5px 10px;font-size:.82rem}
.bt.green{background:var(--g)}
/* login */
.lg{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0b1a33,#16337a)}
.lc{background:#fff;border-radius:18px;padding:34px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.lc .lo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lc .lo svg{height:34px;width:auto}
.lc h1{font-size:1.25rem;line-height:1.2}.lc p.s{color:var(--m);font-size:.9rem;margin:6px 0 18px}
label{display:grid;gap:5px;font-size:.84rem;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cfd7e6;border-radius:8px;background:#fff;font-weight:400;font-size:.95rem}
input:focus,select:focus,textarea:focus{border-color:var(--b);outline:none;box-shadow:0 0 0 3px rgba(30,64,216,.14)}
textarea{resize:vertical}
.fm{display:grid;gap:14px}.pw{position:relative}.pw button{position:absolute;right:6px;top:25px;border:0;background:none;color:var(--b);font-weight:600;cursor:pointer;font-size:.8rem;padding:6px}
.ck{display:flex;align-items:center;gap:8px;font-weight:500}.ck input{width:auto}
.er{color:#b42318;font-size:.88rem;font-weight:600;min-height:1.2em}.lk{color:var(--b);font-size:.86rem;font-weight:600;background:none;border:0;cursor:pointer;justify-self:start}
/* shell */
.tb{position:sticky;top:0;z-index:20;background:var(--n);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px}
.tb .br{display:flex;align-items:center;gap:10px;font-weight:700}.tb .br svg{height:26px;width:auto;fill:#fff}.tb .br b{color:#6ea8ff}
.tb .us{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:.85rem;color:#c3cee4}
.mbt{display:none;background:none;border:1px solid #3a4a6b;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.sh{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 54px)}
.sn{background:#fff;border-right:1px solid var(--line);padding:14px 10px;display:grid;gap:4px;align-content:start}
.sn button{text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font-weight:600;color:var(--m);cursor:pointer}
.sn button:hover{background:var(--bg)}.sn button.on{background:#eef2ff;color:var(--b)}
main{padding:22px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.ph h2{font-size:1.4rem;margin-right:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.st{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}.st b{font-size:1.8rem;display:block;line-height:1.1}.st span{color:var(--m);font-size:.84rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bx{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}.bx h3{font-size:1rem;margin-bottom:12px}
.bl{display:grid;grid-template-columns:140px 1fr 30px;gap:10px;align-items:center;margin-bottom:8px;font-size:.88rem}
.bb{height:10px;background:#eef1f7;border-radius:99px;overflow:hidden}.bb i{display:block;height:100%;border-radius:99px;min-width:2px}
.rc{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.9rem;flex-wrap:wrap}.rc:hover{background:var(--bg)}.rc span{color:var(--m)}.rc small{margin-left:auto;color:var(--m)}
.tl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.tl input,.tl select{width:auto;min-width:150px}.tl input.q{min-width:220px}
.tw{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}th{background:#f8f9fd;text-align:left;padding:10px 12px;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--m);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}tr[data-a]{cursor:pointer}tr[data-a]:hover td{background:#fafbff}
td a{color:var(--b);font-weight:600}.em{padding:30px;text-align:center;color:var(--m);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.ac{display:flex;gap:6px;flex-wrap:wrap}
.pl{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.p0{background:#e8ecf5;color:#33415c}.p1{background:#e0ecff;color:#1d4ed8}.p2{background:#ece5ff;color:#6d28d9}.p3{background:#fff1d6;color:#a35a00}.p4{background:#e0f6ee;color:#0b6e57}.p5{background:#c9f2df;color:#066247}.p6{background:#fde7e5;color:#b42318}.p7{background:#eee;color:#555}
.bb i.p0{background:#94a3c4}.bb i.p1{background:#3b82f6}.bb i.p2{background:#8b5cf6}.bb i.p3{background:#f59e0b}.bb i.p4{background:#10b981}.bb i.p5{background:#059669}.bb i.p6{background:#ef4444}.bb i.p7{background:#9ca3af}
/* modal */
.mo{position:fixed;inset:0;background:rgba(10,20,40,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.md{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto}.md.wide{max-width:760px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}.mh h3{font-size:1.1rem}
.x{border:0;background:none;font-size:1.6rem;cursor:pointer;color:var(--m);line-height:1}.mb{padding:20px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .full{grid-column:1/-1}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.mf .l{margin-right:auto}
.sm{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:.88rem;background:var(--bg);padding:12px;border-radius:10px;margin-bottom:14px}.sm span{color:var(--m)}.sm .full{grid-column:1/-1}
.hs{font-size:.86rem;border-left:3px solid var(--line);padding-left:12px;display:grid;gap:8px;margin-top:8px}.hs small{color:var(--m)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:11px 18px;border-radius:10px;z-index:99;font-weight:600;max-width:90vw}.toast.bad{background:#b42318}
.cn{max-width:520px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center}
@media(max-width:860px){.sh{grid-template-columns:1fr}.sn{display:none;border-right:0;border-bottom:1px solid var(--line)}.sn.open{display:grid}.mbt{display:block}.two{grid-template-columns:1fr}.tb .us span{display:none}main{padding:14px}}
@media(max-width:520px){.fg,.sm{grid-template-columns:1fr}.bl{grid-template-columns:100px 1fr 28px}}
</style>

const S={user:null,profile:null,clients:[],jobs:[],candidates:[],applications:[],users:[],myClient:{},view:'',pf:{}};

2 L25.90,2.26 L2.80,2.27 L2.00,2.39 L1.46,2.70 L1.19,3.20 L1.23,3.50 L1.40,3.73 L3.50,4.52 L4.40,5.01 L4.90,5.40 L5.70,6.37 L6.10,7.20 L6.53,8.60 L6.67,10.90 L6.63,90.50 L6.40,92.07 L5.98,93.10 L5.50,93.90 L4.80,94.62 L4.10,95.16 L3.30,95.62 L2.00,96.10 L1.60,96.36 L1.36,97.00 L1.50,97.42 L2.10,97.75 L3.00,97.84 L26.20,97.85 L27.02,97.70 L27.52,97.30 L27.53,96.80 L27.20,96.27 L25.20,95.44 L24.20,94.71 L23.52,94.00 L22.83,92.80 L22.50,91.40 L22.42,89.00 L22.39,51.90 L22.50,51.50 L22.70,51.27 L23.30,51.02 L23.80,50.97 L62.70,50.96 L63.30,51.03 L63.70,51.25 L63.90,51.55 L63.97,52.00 L63.89,91.40 L63.48,93.00 L62.60,94.30 L61.60,95.02 L59.90,95.65 L59.28,96.00 L58.83,96.60 L58.83,97.30 L59.30,97.70 L60.50,97.84 L85.10,97.80Z"/></svg>';

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const ms=t=>t&&t.toMillis?t.toMillis():0;
const fmt=t=>{try{const d=t&&t.toDate?t.toDate():null;return d?d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):''}catch(e){return''}};
const by=(a,id)=>a.find(x=>x.id===id)||{};
const clean=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v??'']));
const pill=s=>`<span class="pl p${Math.max(0,ST.indexOf(s))}">${esc(s)}</span>`;
const root=()=>$('#root');
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4200)}
function errText(e){const c=e&&e.code||'';if(c.includes('permission-denied'))return'Permission denied. Check that your account has a role and the security rules are published.';if(c.includes('unavailable')||c.includes('network'))return'Network problem. Please check your internet connection.';return(e&&e.message)||'Something went wrong.'}
function modal(title,body,wide){const m=document.createElement('div');m.className='mo';m.innerHTML=`<div class="md${wide?' wide':''}" role="dialog" aria-modal="true"><div class="mh"><h3>${esc(title)}</h3><button class="x" aria-label="Close">&times;</button></div><div class="mb">${body}</div></div>`;document.body.appendChild(m);const close=()=>m.remove();$('.x',m).onclick=close;m.addEventListener('mousedown',e=>{if(e.target===m)close()});return{m,close}}
function fld(f,v){const val=(v&&v[f.k])??f.def??'',id='f_'+f.k;let c;
 if(f.t==='select')c=`<select id="${id}" ${f.req?'required':''}>${f.o.map(o=>{const a=Array.isArray(o)?o:[o,o];return`<option value="${esc(a[0])}" ${String(a[0])===String(val)?'selected':''}>${esc(a[1])}</option>`}).join('')}</select>`;
 else if(f.t==='textarea')c=`<textarea id="${id}" rows="3">${esc(val)}</textarea>`;
 else c=`<input id="${id}" type="${f.t||'text'}" value="${esc(val)}" ${f.req?'required':''} ${f.t==='password'?'minlength="8" autocomplete="new-password"':''}>`;
 return`<label class="${f.full?'full':''}">${esc(f.l)}${f.req?' *':''}${c}</label>`}
const formHtml=(fs,v)=>`<div class="fg">${fs.map(f=>fld(f,v)).join('')}</div>`;
const readF=(r,fs)=>Object.fromEntries(fs.map(f=>[f.k,($('#f_'+f.k,r).value||'').trim()]));
async function load(n){const s=await getDocs(collection(db,n));S[n]=s.docs.map(d=>({id:d.id,...d.data()}))}
async function put(c,id,data){if(id){await updateDoc(doc(db,c,id),{...clean(data),updatedAt:serverTimestamp()});return id}const r=await addDoc(collection(db,c),{...clean(data),createdAt:serverTimestamp(),updatedAt:serverTimestamp()});return r.id}
function csv(name,head,rows){const q=v=>{let s=String(v??'');if(/^[=@]|^[+\-](?!\d)/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};const t='\ufeff'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
const tbl=(head,rows,empty)=>rows.length?`<div class="tw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="em">${empty||'Nothing here yet.'}</div>`;
const ph=(t,a)=>`<div class="ph"><h2>${esc(t)}</h2>${a||''}</div>`;
const main=h=>{$('#mn').innerHTML=h};
const stat=(l,n)=>`<div class="st"><b>${n}</b><span>${esc(l)}</span></div>`;
const link=u=>safeUrl(u)?`<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener noreferrer">Open</a>`:'';

/* ---------- login ---------- */
function renderLogin(msg){
 root().innerHTML=`<div class="lg"><form class="lc fm" id="lf" autocomplete="on"><div class="lo">${LOGO.replace('<svg','<svg fill="#0b1a33"')}<h1>Hiretalnexa <span style="color:#1e40d8">Tracker</span></h1></div><p class="s">Sign in to manage candidates and hiring updates.</p>
 <label>Email<input id="em" type="email" required autocomplete="username"></label>
 <div class="pw"><label>Password<input id="pw" type="password" required autocomplete="current-password"></label><button type="button" id="sp">Show</button></div>
 <label class="ck"><input type="checkbox" id="kp"> Keep me signed in on this device</label>
 <div class="er" id="er" role="alert">${esc(msg||'')}</div>
 <button class="bt" id="sb" type="submit" style="justify-content:center">Sign in</button>
 <button type="button" class="lk" id="fp">Forgot password?</button>
 <p class="s" style="margin:0;font-size:.8rem">Authorised users only. Need access? Email hr@hiretalnexa.com</p></form></div>`;
 $('#sp').onclick=()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password';$('#sp').textContent=p.type==='password'?'Show':'Hide'};
 $('#fp').onclick=async()=>{const e=$('#em').value.trim();if(!e){$('#er').textContent='Enter your email above first.';return}try{await sendPasswordResetEmail(auth,e)}catch(x){}$('#er').style.color='#0f7a5c';$('#er').textContent='If an account exists for that email, a reset link has been sent.'};
 $('#lf').onsubmit=async ev=>{ev.preventDefault();const b=$('#sb');b.disabled=true;b.textContent='Signing in...';$('#er').style.color='';$('#er').textContent='';
  try{await setPersistence(auth,$('#kp').checked?browserLocalPersistence:browserSessionPersistence);await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}
  catch(e){const c=e.code||'';$('#er').textContent=c.includes('too-many')?'Too many attempts. Please wait a while or reset your password.':c.includes('network')?'Network problem. Check your connection.':'Incorrect email or password.';b.disabled=false;b.textContent='Sign in'}};
}
function renderBlock(title,text){root().innerHTML=`<div class="lg"><div class="cn"><h2>${esc(title)}</h2><p style="color:#5b677d;margin:10px 0 18px">${esc(text)}</p><button class="bt" id="so">Sign out</button></div></div>`;$('#so').onclick=()=>signOut(auth)}

/* ---------- shell ---------- */
const NAV={admin:[['dash','Dashboard'],['pipe','Pipeline'],['cands','Candidates'],['jobs','Jobs'],['clients','Clients'],['users','Users']],client:[['cdash','Overview'],['ccands','Candidates']]};
const VIEWS={};
function shell(){
 const adm=S.profile.role==='admin';
 root().innerHTML=`<header class="tb"><button class="mbt" id="mb" aria-label="Menu">&#9776;</button><div class="br">${LOGO}<span>Hiretalnexa <b>Tracker</b></span></div><div class="us"><span>${esc(S.profile.name||S.user.email)} &middot; ${adm?'Admin':esc(S.myClient.name||'Client')}</span><button class="bt ghost sm" id="lo">Sign out</button></div></header>
 <div class="sh"><nav class="sn" id="sn">${NAV[S.profile.role].map(n=>`<button data-v="${n[0]}">${n[1]}</button>`).join('')}</nav><main id="mn"></main></div>`;
 $('#lo').onclick=()=>signOut(auth);$('#mb').onclick=()=>$('#sn').classList.toggle('open');
 $('#sn').onclick=e=>{const b=e.target.closest('[data-v]');if(b){go(b.dataset.v);$('#sn').classList.remove('open')}};
 $('#mn').onclick=onAct;
 go(adm?'dash':'cdash');

});
let idle;const bump=()=>{clearTimeout(idle);if(auth.currentUser)idle=setTimeout(()=>signOut(auth),30*60*1000)};
['click','keydown','mousemove','touchstart'].forEach(ev=>addEventListener(ev,bump,{passive:true}));

</script>
