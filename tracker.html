function validEmail(e){if(/\s/.test(e)||e.includes('..')||e.length>100)return false;const m=e.match(/^([A-Za-z0-9._%+\-]+)@([A-Za-z0-9\-]+(?:\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,})$/);if(!m)return false;if(m[1].startsWith('.')||m[1].endsWith('.'))return false;return m[2].split('.').every(p=>p&&!p.startsWith('-')&&!p.endsWith('-'))}
function filt(f,v){
 if(f.t==='password')return v.replace(/\s/g,'');
 switch(f.rule){
  case'alnum':return v.replace(/[^A-Za-z0-9 ]/g,'').replace(/^ +/,'');
  case'alpha':return v.replace(/[^A-Za-z ]/g,'').replace(/^ +/,'');
  case'email':return v.replace(/\s/g,'');
  case'phone':return v.replace(/\D/g,'').replace(/^[0-5]+/,'').slice(0,10);
  case'dec1':{v=v.replace(/[^0-9.]/g,'');const p=v.split('.');let i=p[0].slice(0,2);return p.length>1?i+'.'+p.slice(1).join('').slice(0,1):i}
  case'int':return v.replace(/\D/g,'').replace(/^0+/,'').slice(0,4);
  default:return v.replace(/^\s+/,'')}}
function ruleErr(f,v){switch(f.rule){
 case'alnum':return/^[A-Za-z0-9 ]+$/.test(v)?'':'Only letters and numbers are allowed.';
 case'alpha':return/^[A-Za-z ]+$/.test(v)?'':'Only letters are allowed.';
 case'email':return validEmail(v)?'':'Enter a valid email address.';
 case'phone':return/^[6-9]\d{9}$/.test(v)?'':'Enter a valid 10-digit mobile number starting with 6, 7, 8 or 9.';
 case'dec1':return/^\d{1,2}(\.\d)?$/.test(v)?'':'Enter a number with at most one decimal, e.g. 5 or 5.5.';
 case'int':return/^[1-9]\d{0,3}$/.test(v)?'':'Enter a whole number of 1 or more.';
 default:return''}}
function showErr(el,e){if(!el)return;el.setAttribute('aria-invalid',e?'true':'false');const s=el.closest('label');const fe=s&&s.querySelector('.fe');if(fe)fe.textContent=e||''}
function fld(f,v){
 const val=(v&&v[f.k])??f.def??'',id='f_'+f.k,ph=f.ph?` placeholder="${esc(f.ph)}"`:'',mx=f.max?` maxlength="${f.max}"`:'';let c='';
 if(f.t==='select')c=`<select id="${id}">${f.o.map(o=>{const a=Array.isArray(o)?o:[o,o];return`<option value="${esc(a[0])}" ${String(a[0])===String(val)?'selected':''}>${esc(a[1])}</option>`}).join('')}</select>`;
 else if(f.t==='textarea')c=`<textarea id="${id}" rows="3"${mx}${ph}>${esc(val)}</textarea>`+(f.counter?`<small class="cc" data-cc="${id}">${String(val).length}/${f.max}</small>`:'');
 else if(f.t==='phone')c=`<div class="p91"><span aria-hidden="true">+91</span><input id="${id}" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="10-digit mobile number" value="${esc(String(val).replace(/^\+91\s*/,''))}"></div>`;
 else if(f.t==='loc')c=`<div class="lw"><input id="${id}" autocomplete="off" placeholder="Search by city, area or pincode" value="${esc(val)}"><div class="lr" id="lr" hidden></div></div>`;
 else c=`<input id="${id}" type="text" value="${esc(val)}"${mx}${ph} autocomplete="off" ${f.rule==='email'?'inputmode="email"':''} ${f.rule==='int'?'inputmode="numeric"':''} ${f.rule==='dec1'?'inputmode="decimal"':''}>`;
 return`<label class="${f.full?'full':''}">${esc(f.l)}${f.req?' *':''}${c}<small class="fe"></small></label>`}
const formHtml=(fs,v)=>`<div class="fg">${fs.map(f=>fld(f,v)).join('')}</div>`;
function bind(m,fs){fs.forEach(f=>{const el=$('#f_'+f.k,m);if(!el||f.t==='select'||f.t==='loc')return;el.addEventListener('input',()=>{const nv=filt(f,el.value);if(nv!==el.value)el.value=nv;showErr(el,'');const cc=$(`[data-cc="f_${f.k}"]`,m);if(cc)cc.textContent=el.value.length+'/'+f.max})});
 fs.filter(f=>f.t==='select').forEach(f=>{const el=$('#f_'+f.k,m);el.addEventListener('change',()=>showErr(el,''))})}
function check(m,fs){let ok=true,first=null;const out={};
 fs.forEach(f=>{const el=$('#f_'+f.k,m);if(!el)return;let e='';
  if(f.t==='loc'){const L=m._loc,txt=el.value.trim();if(el.value&&!txt)e='Cannot contain only spaces.';else if(txt&&!L.data)e='Please select a location from the search results.';const d=L.data||{};Object.assign(out,{location:d.location||'',locArea:d.area||'',locCity:d.city||'',locState:d.state||'',locCountry:d.country||'',locPincode:d.pincode||''});
  }else if(f.t==='password'){const raw=el.value;if(!raw)e='This field is required.';else if(/\s/.test(raw))e='Spaces are not allowed.';else if(raw.length<6)e='Use at least 6 characters.';out[f.k]=raw}
  else{const raw=el.value,v=raw.trim();if(raw&&!v)e='Cannot contain only spaces.';else if(!v&&f.req)e='This field is required.';else if(v)e=ruleErr(f,v);out[f.k]=v}
  showErr(el,e);if(e){ok=false;if(!first)first=el}});
 if(first)first.focus();return ok?out:null}
function formModal(title,fs,vals,onSave,wide,label){
 const{m,close}=modal(title,`<form id="mf" novalidate>${formHtml(fs,vals)}<div class="mf"><button type="button" class="bt ghost" id="cx">Cancel</button><button class="bt" type="submit">${esc(label||'Save')}</button></div></form>`,wide);
 $('#cx',m).onclick=close;bind(m,fs);if(fs.some(f=>f.t==='loc'))m._loc=locSetup(m,vals);
 $('#mf',m).onsubmit=async e=>{e.preventDefault();const d=check(m,fs);if(!d)return;await busy($('button[type=submit]',m),async()=>{try{await onSave(d,close,m)}catch(x){toast(errText(x),true)}})};
 return{m,close}}

/* ---------- location search ---------- */
function locSetup(m,v){
 const inp=$('#f_location',m),lr=$('#lr',m),L={data:null};let tm,seq=0;
 if(v&&v.location)L.data={location:v.location,area:v.locArea||'',city:v.locCity||'',state:v.locState||'',country:v.locCountry||'',pincode:v.locPincode||''};
 const disp=r=>[r.area,r.city,r.state,r.country].filter((x,i,a)=>x&&a.indexOf(x)===i).join(', ')+(r.pincode?' - '+r.pincode:'');
 async function find(q){let res=[];
  try{const u=/^\d{6}$/.test(q)?`https://api.postalpincode.in/pincode/${q}`:`https://api.postalpincode.in/postoffice/${encodeURIComponent(q)}`;const j=await(await fetch(u)).json();res=((j&&j[0]&&j[0].PostOffice)||[]).map(p=>({area:p.Name,city:p.District,state:p.State,country:p.Country||'India',pincode:p.Pincode}))}catch(e){}
  if(!res.length){try{const j=await(await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&lang=en&bbox=68,6,98,36`)).json();res=(j.features||[]).map(f=>{const p=f.properties||{};return{area:p.name||'',city:p.city||p.district||p.county||'',state:p.state||'',country:p.country||'India',pincode:p.postcode||''}})}catch(e){}}
  const seen=new Set();return res.map(r=>({...r,location:disp(r)})).filter(r=>r.location&&!seen.has(r.location)&&seen.add(r.location)).slice(0,8)}
 const show=(items,txt,failed)=>{lr.hidden=false;lr.innerHTML=(items.length?items.map((r,i)=>`<button type="button" data-i="${i}">${esc(r.location)}</button>`).join(''):`<div class="nt2">No matching locations found.</div>`)+((!items.length)?`<button type="button" data-m="1">Use &ldquo;${esc(txt)}&rdquo; as typed</button>`:'');
  lr.onmousedown=e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();if(b.dataset.m){L.data={location:txt,area:'',city:'',state:'',country:'',pincode:''};inp.value=txt}else{L.data=items[+b.dataset.i];inp.value=L.data.location}lr.hidden=true;showErr(inp,'')}};
 inp.addEventListener('input',()=>{const nv=inp.value.replace(/^\s+/,'');if(nv!==inp.value)inp.value=nv;L.data=null;showErr(inp,'');clearTimeout(tm);const q=inp.value.trim();if(q.length<3){lr.hidden=true;return}
  const my=++seq;tm=setTimeout(async()=>{lr.hidden=false;lr.innerHTML='<div class="nt2">Searching...</div>';const items=await find(q);if(my!==seq)return;show(items,q)},450)});
 inp.addEventListener('blur',()=>setTimeout(()=>{lr.hidden=true},180));
 return L}

async function put(c,id,data){if(id){await updateDoc(doc(db,c,id),{...clean(data),updatedAt:serverTimestamp()});return id}const r=await addDoc(collection(db,c),{...clean(data),createdAt:serverTimestamp(),updatedAt:serverTimestamp()});return r.id}
function csv(name,head,rows){const q=v=>{let s=String(v??'');if(/^[=@]|^[+\-](?!\d)/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};const t='\ufeff'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
const tbl=(head,rows,empty)=>rows.length?`<div class="tw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="em">${empty||'Nothing here yet.'}</div>`;

/* ---------- change password ---------- */
function changePw(){
 const{m,close}=modal('Change password',`<form id="mf" class="fm" novalidate>
 <label>Current password<input id="p0" type="password" autocomplete="current-password"><small class="fe"></small></label>
 <label>New password<input id="p1" type="password" autocomplete="new-password"><small class="fe"></small></label>
 <label>Confirm new password<input id="p2" type="password" autocomplete="new-password"><small class="fe"></small></label>
 <p style="color:#5b677d;font-size:.82rem">At least 8 characters with one uppercase letter, one lowercase letter, one number and one special character. No spaces.</p>
 <label class="ck"><input type="checkbox" id="sw"> Show passwords</label>
 <div class="mf"><button type="button" class="bt ghost" id="cx">Cancel</button><button class="bt" type="submit">Change password</button></div></form>`);
 const ids=['p0','p1','p2'],el=i=>$('#'+i,m);
 $('#cx',m).onclick=close;$('#sw',m).onchange=e=>ids.forEach(i=>el(i).type=e.target.checked?'text':'password');
 ids.forEach(i=>el(i).addEventListener('input',()=>{const nv=el(i).value.replace(/\s/g,'');if(nv!==el(i).value)el(i).value=nv;showErr(el(i),'')}));
 $('#mf',m).onsubmit=async ev=>{ev.preventDefault();ids.forEach(i=>showErr(el(i),''));
  const cur=el('p0').value,nw=el('p1').value,cf=el('p2').value;let bad=false;
  if(!cur){showErr(el('p0'),'Enter your current password.');bad=true}
  if(!nw){showErr(el('p1'),'Enter a new password.');bad=true}
  if(!cf){showErr(el('p2'),'Confirm your new password.');bad=true}
  if(bad)return;
  await busy($('button[type=submit]',m),async()=>{
   try{await reauthenticateWithCredential(auth.currentUser,EmailAuthProvider.credential(auth.currentUser.email,cur))}
   catch(x){const c=x.code||'';showErr(el('p0'),c.includes('too-many')?'Too many attempts. Please try again later.':c.includes('network')?'Network problem. Please try again.':'Current password is incorrect.');return}
   const miss=[];if(nw.length<8)miss.push('at least 8 characters');if(!/[A-Z]/.test(nw))miss.push('an uppercase letter');if(!/[a-z]/.test(nw))miss.push('a lowercase letter');if(!/\d/.test(nw))miss.push('a number');if(!/[^A-Za-z0-9]/.test(nw))miss.push('a special character');
   if(miss.length){showErr(el('p1'),'Password needs '+miss.join(', ')+'.');return}
   if(nw===cur){showErr(el('p1'),'New password must be different from the current one.');return}
   if(cf!==nw){showErr(el('p2'),'Passwords do not match.');return}
   try{await updatePassword(auth.currentUser,nw);close();toast('Password changed successfully')}catch(x){showErr(el('p1'),errText(x))}
  },'Updating...')};
}

function jobForm(id){const j=by(S.jobs,id);formModal(id?'Edit job':'Add job',jf(),id?j:{status:'Open',priority:'Normal',openings:'1'},async(d,close)=>{await put('jobs',id,d);await load('jobs');close();toast('Job saved');VIEWS.jobs()},1)}
ACT.addJob=()=>jobForm();ACT.editJob=id=>jobForm(id);
ACT.viewDesc=id=>{const j=by(S.jobs,id),{m,close}=modal(j.title||'Job description',`<div class="pre">${esc(j.description)}</div><div class="mf"><button class="bt ghost" id="cx">Close</button></div>`,1);$('#cx',m).onclick=close};
ACT.jobPipe=id=>{S.pf={job:id};go('pipe')};
ACT.delJob=async id=>{if(S.applications.some(a=>a.jobId===id)){toast('This job has candidates in the pipeline. Remove them first or set the job to Closed.',true);return}if(!await confirmBox('Delete this job?','Delete'))return;await deleteDoc(doc(db,'jobs',id));await load('jobs');VIEWS.jobs()};

/* ---------- candidates ---------- */
const CF=[{k:'name',l:'Full name',req:1,rule:'free',max:80},{k:'phone',l:'Phone',req:1,rule:'free',max:20},{k:'email',l:'Email',rule:'free',max:100},{k:'location',l:'Current location',rule:'free',max:100},{k:'skills',l:'Key skills',rule:'free',max:300,full:1},{k:'experience',l:'Total experience (years)',rule:'free',max:10},{k:'noticePeriod',l:'Notice period',rule:'free',max:30},{k:'currentCtc',l:'Current CTC',rule:'free',max:30},{k:'expectedCtc',l:'Expected CTC',rule:'free',max:30},{k:'source',l:'Source (e.g. Naukri, LinkedIn)',rule:'free',max:50},{k:'resumeLink',l:'Resume link (Google Drive)',rule:'free',max:500,full:1},{k:'notes',l:'Internal notes',t:'textarea',rule:'free',max:1000,full:1}];
VIEWS.cands=()=>{
 main(ph('Candidates','<button class="bt ghost" data-a="expCands">Export CSV</button><button class="bt" data-a="addCand">+ Add candidate</button>')+`<div class="tl"><input class="q" id="q" placeholder="Search name, skills, phone, location" aria-label="Search"></div><div id="tb"></div>`);
 const fill=()=>{const q=($('#q').value||'').toLowerCase(),L=S.candidates.filter(c=>[c.name,c.skills,c.phone,c.email,c.location].join(' ').toLowerCase().includes(q)).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));
  $('#tb').innerHTML=tbl(['Name','Contact','Skills','Exp','Expected CTC','Notice','Location','Resume','Actions'],L.slice(0,300).map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}<br><small>${esc(c.email)}</small></td><td>${esc(c.skills)}</td><td>${esc(c.experience)}</td><td>${esc(c.expectedCtc)}</td><td>${esc(c.noticePeriod)}</td><td>${esc(c.location)}</td><td>${link(c.resumeLink)}</td><td class="ac"><button class="bt green sm" data-a="toJob" data-id="${c.id}">Add to job</button><button class="bt ghost sm" data-a="editCand" data-id="${c.id}">Edit</button>${isAdm()?`<button class="bt red sm" data-a="delCand" data-id="${c.id}">Delete</button>`:''}</td></tr>`),'No candidates found.')};
 $('#q').oninput=fill;fill();
};
function candForm(id){const c=by(S.candidates,id);formModal(id?'Edit candidate':'Add candidate',CF,id?c:{},async(d,close)=>{if(d.resumeLink&&!safeUrl(d.resumeLink)){toast('Resume link must start with http:// or https://',true);return}await put('candidates',id,d);await load('candidates');close();toast('Candidate saved');VIEWS.cands()},1)}
ACT.addCand=()=>candForm();ACT.editCand=id=>candForm(id);
ACT.delCand=async id=>{if(S.applications.some(a=>a.candidateId===id)){toast('This candidate is in the pipeline. Remove those entries first.',true);return}if(!await confirmBox('Delete this candidate?','Delete'))return;await deleteDoc(doc(db,'candidates',id));await load('candidates');VIEWS.cands()};
ACT.expCands=()=>csv('candidates.csv',['Name','Phone','Email','Location','Skills','Experience','Notice period','Current CTC','Expected CTC','Source','Resume link','Notes'],S.candidates.map(c=>[c.name,c.phone,c.email,c.location,c.skills,c.experience,c.noticePeriod,c.currentCtc,c.expectedCtc,c.source,c.resumeLink,c.notes]));
ACT.toJob=id=>{const c=by(S.candidates,id),jobs=S.jobs.filter(j=>j.status==='Open');if(!jobs.length){toast('No open jobs. Add a job first.',true);return}
 const{m,close}=modal('Add '+c.name+' to a job',`<form id="mf" class="fm"><label>Job<select id="jb">${jobs.map(j=>`<option value="${j.id}">${esc(j.title)} - ${esc(by(S.clients,j.clientId).name)}</option>`).join('')}</select></label><label>Starting stage<select id="sg">${ST.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><div class="mf"><button type="button" class="bt ghost" id="cx">Cancel</button><button class="bt" type="submit">Add to pipeline</button></div></form>`);
 $('#cx',m).onclick=close;$('#mf',m).onsubmit=async e=>{e.preventDefault();const jid=$('#jb',m).value,j=by(S.jobs,jid);
  if(S.applications.some(a=>a.candidateId===id&&a.jobId===jid)){toast('This candidate is already in that job\'s pipeline.',true);return}
  await busy($('button[type=submit]',m),async()=>{try{const stage=$('#sg',m).value,aid=await put('applications',null,{candidateId:id,jobId:jid,clientId:j.clientId,stage,sharedWithClient:false,shared:{},clientStatus:'',clientFeedback:''});
   await addDoc(collection(db,'applications',aid,'history'),{stage,note:'Added to pipeline',by:S.profile.name||S.user.email,at:serverTimestamp()});
   await load('applications');close();toast('Added to pipeline')}catch(x){toast(errText(x),true)}},'Adding...')}};

/* ---------- pipeline ---------- */
VIEWS.pipe=()=>{
 const pf=S.pf||{};
 main(ph('Pipeline','<button class="bt ghost" data-a="expPipe">Export CSV</button>')+`<div class="tl"><select id="fc" aria-label="Client"><option value="">All clients</option>${S.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><select id="fj" aria-label="Job"><option value="">All jobs</option>${S.jobs.map(j=>`<option value="${j.id}" ${pf.job===j.id?'selected':''}>${esc(j.title)}</option>`).join('')}</select><select id="fs" aria-label="Stage"><option value="">All stages</option>${ST.map(s=>`<option>${esc(s)}</option>`).join('')}</select><input class="q" id="q" placeholder="Search candidate" aria-label="Search"></div><div id="tb"></div>`);
 S.pf={};
 const rows=()=>{const c=$('#fc').value,j=$('#fj').value,s=$('#fs').value,q=$('#q').value.toLowerCase();return S.applications.filter(a=>(!c||a.clientId===c)&&(!j||a.jobId===j)&&(!s||a.stage===s)&&(!q||(by(S.candidates,a.candidateId).name||'').toLowerCase().includes(q))).sort((a,b)=>ms(b.updatedAt)-ms(a.updatedAt))};
 const fill=()=>{$('#tb').innerHTML=tbl(['Candidate','Job','Client','Stage','Shared','Client status','Updated'],rows().map(a=>`<tr data-a="app" data-id="${a.id}"><td><b>${esc(by(S.candidates,a.candidateId).name||'(removed)')}</b></td><td>${esc(by(S.jobs,a.jobId).title)}</td><td>${esc(by(S.clients,a.clientId).name)}</td><td>${pill(a.stage)}</td><td>${a.sharedWithClient?'Yes':'No'}</td><td>${esc(a.clientStatus)}</td><td>${fmt(a.updatedAt)}</td></tr>`),'No pipeline entries match. Add candidates to jobs from the Candidates page.')};
 ['fc','fj','fs'].forEach(i=>$('#'+i).onchange=fill);$('#q').oninput=fill;fill();
 S.pipeRows=rows;
};
ACT.expPipe=()=>{const L=S.pipeRows?S.pipeRows():S.applications;csv('pipeline.csv',['Candidate','Job','Client','Stage','Shared with client','Client status','Client feedback','Updated'],L.map(a=>[by(S.candidates,a.candidateId).name,by(S.jobs,a.jobId).title,by(S.clients,a.clientId).name,a.stage,a.sharedWithClient?'Yes':'No',a.clientStatus,a.clientFeedback,fmt(a.updatedAt)]))};
ACT.app=async id=>{
 const a=by(S.applications,id),c=by(S.candidates,a.candidateId),j=by(S.jobs,a.jobId),cl=by(S.clients,a.clientId);
 const{m,close}=modal(c.name||'Pipeline entry',`<div class="sm"><div><span>Job</span><br>${esc(j.title)}</div><div><span>Client</span><br>${esc(cl.name)}</div><div><span>Phone</span><br>${esc(c.phone)}</div><div><span>Email</span><br>${esc(c.email)}</div><div><span>Experience / Notice</span><br>${esc(c.experience)} / ${esc(c.noticePeriod)}</div><div><span>Current / Expected CTC</span><br>${esc(c.currentCtc)} / ${esc(c.expectedCtc)}</div><div class="full"><span>Skills</span><br>${esc(c.skills)}</div><div><span>Resume</span><br>${link(c.resumeLink)||'-'}</div><div><span>Client feedback</span><br>${esc(a.clientStatus)||'-'} ${a.clientFeedback?'<br><small>'+esc(a.clientFeedback)+'</small>':''}</div></div>
 <form id="mf"><div class="fg"><label>Stage<select id="sg">${ST.map(s=>`<option ${s===a.stage?'selected':''}>${esc(s)}</option>`).join('')}</select></label><label class="ck" style="align-self:end"><input type="checkbox" id="sh" ${a.sharedWithClient?'checked':''}> Share with client</label><label class="full">Update note (internal, saved in history)<textarea id="nt" rows="2" maxlength="500"></textarea></label><label class="full">Note for client (shown only if shared)<textarea id="cn" rows="2" maxlength="500">${esc((a.shared||{}).note||'')}</textarea></label></div>
 <div class="mf">${isAdm()?'<button type="button" class="bt red l" id="rm">Remove from pipeline</button>':''}<button type="button" class="bt ghost" id="cx">Close</button><button class="bt" type="submit">Save update</button></div></form><h4 style="margin-top:14px">History</h4><div class="hs" id="hs">Loading...</div>`,1);
 $('#cx',m).onclick=close;
 const hist=async()=>{try{const s=await getDocs(collection(db,'applications',id,'history'));const L=s.docs.map(d=>d.data()).sort((x,y)=>ms(y.at)-ms(x.at));$('#hs',m).innerHTML=L.length?L.map(h=>`<div><b>${esc(h.stage)}</b> <small>${fmt(h.at)} by ${esc(h.by)}</small>${h.note?'<br>'+esc(h.note):''}</div>`).join(''):'No history yet.'}catch(x){$('#hs',m).textContent='Could not load history.'}};hist();
 if($('#rm',m))$('#rm',m).onclick=async()=>{if(!await confirmBox('Remove this entry from the pipeline?','Remove'))return;try{await deleteDoc(doc(db,'applications',id));await load('applications');close();VIEWS[S.view]()}catch(x){toast(errText(x),true)}};
 $('#mf',m).onsubmit=async e=>{e.preventDefault();const rn=$('#nt',m).value,rc=$('#cn',m).value;if((rn&&!rn.trim())||(rc&&!rc.trim())){toast('Notes cannot contain only spaces.',true);return}
  await busy($('button[type=submit]',m),async()=>{try{const stage=$('#sg',m).value,share=$('#sh',m).checked,note=rn.trim(),cn=rc.trim(),changed=stage!==a.stage;
   const upd={stage,sharedWithClient:share,shared:clean({name:c.name,skills:c.skills,experience:c.experience,location:c.location,noticePeriod:c.noticePeriod,expectedCtc:c.expectedCtc,resumeLink:c.resumeLink,note:cn})};
   await put('applications',id,upd);
   if(changed||note)await addDoc(collection(db,'applications',id,'history'),{stage,note:note||(changed?'Stage updated':''),by:S.profile.name||S.user.email,at:serverTimestamp()});
   await load('applications');toast('Updated');close();VIEWS[S.view]()}catch(x){toast(errText(x),true)}},'Saving...')};
};

/* ---------- users (admin only) ---------- */
const roleLab=r=>r==='admin'?'Admin':r==='user'?'User':'Client';
VIEWS.users=()=>{
 main(ph('Users','<button class="bt" data-a="addUser">+ Add user</button>')+tbl(['Name','Email','Role','Actions'],S.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td>${roleLab(u.role)}</td><td class="ac"><button class="bt ghost sm" data-a="resetUser" data-id="${u.id}">Send reset email</button>${u.id===S.user.uid?'':ib('delUser',u.id,'userx','Remove access','red')}</td></tr>`),'No users.')+'<p style="color:#5b677d;font-size:.84rem;margin-top:10px">Passwords are never stored or shown anywhere. If someone forgets theirs, use Send reset email. Removing access blocks the person from all data; to fully delete a login, also remove it in Firebase Authentication.</p>');
};
ACT.resetUser=async id=>{const u=by(S.users,id);await sendPasswordResetEmail(auth,u.email);toast('Reset email sent to '+u.email)};
ACT.delUser=async id=>{if(!await confirmBox('Remove this person\'s access?','Remove'))return;await deleteDoc(doc(db,'users',id));await load('users');VIEWS.users()};
const genPw=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789@#$%',r=crypto.getRandomValues(new Uint32Array(12));return Array.from(r,x=>a[x%a.length]).join('')};
ACT.addUser=()=>{const F=[{k:'name',l:'Full name',req:1,rule:'alpha',max:60},{k:'email',l:'Email',req:1,rule:'email',max:100},{k:'password',l:'Temporary password',t:'password',full:1},{k:'role',l:'Role',t:'select',o:[['user','User'],['admin','Admin']]}];
 const{m}=formModal('Add user',F,{role:'user'},async(d,close)=>{
  overlay(true,'Creating user...');const sec=initializeApp(cfg,'sec'+Date.now());
  try{const sa=getAuth(sec),cr=await createUserWithEmailAndPassword(sa,d.email,d.password);await signOut(sa);
   await setDoc(doc(db,'users',cr.user.uid),{name:d.name,email:d.email,role:d.role,clientId:'',createdAt:serverTimestamp()});
   await load('users');close();VIEWS.users();creds(d.email,d.password)}
  catch(x){toast((x.code||'').includes('email-already')?'That email already has a login.':errText(x),true)}
  finally{overlay(false);deleteApp(sec).catch(()=>{})}});
 const pw=$('#f_password',m);pw.placeholder='Type one or generate';const g=document.createElement('button');g.type='button';g.className='dz';g.textContent='Generate a strong password';g.onclick=()=>{pw.value=genPw();showErr(pw,'')};pw.after(g)};
function creds(email,pw){const{m,close}=modal('User created',`<p>Share these login details privately. The password cannot be viewed again later.</p><div class="cr"><span>Email: <b>${esc(email)}</b></span><button class="bt ghost sm" data-c="${esc(email)}">Copy</button></div><div class="cr"><span>Password: <b>${esc(pw)}</b></span><button class="bt ghost sm" data-c="${esc(pw)}">Copy</button></div><div class="mf"><button class="bt" id="cx">Done</button></div>`);
 $('#cx',m).onclick=close;m.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b&&navigator.clipboard)navigator.clipboard.writeText(b.dataset.c).then(()=>toast('Copied'))})}

/* ---------- client panel ---------- */
VIEWS.cdash=()=>{
 const A=S.applications,cnt=s=>A.filter(a=>a.stage===s).length;
 main(ph('Welcome, '+(S.myClient.name||'Client'))+`<div class="cards">${stat('Open jobs',S.jobs.filter(j=>j.status==='Open').length)}${stat('Candidates shared',A.length)}${stat('In interview',cnt('Interview'))}${stat('Offered',cnt('Offered'))}${stat('Joined',cnt('Joined'))}</div>`+'<h3 style="margin-bottom:10px">Your jobs</h3>'+tbl(['Title','Location','Openings','Status','Candidates shared'],S.jobs.map(j=>`<tr><td><b>${esc(j.title)}</b><br><small>${esc(j.skills)}</small></td><td>${esc(j.location)}</td><td>${esc(j.openings)}</td><td>${esc(j.status)}</td><td>${A.filter(a=>a.jobId===j.id).length}</td></tr>`),'No jobs have been added for you yet.'));
};
VIEWS.ccands=()=>{
 main(ph('Candidates')+tbl(['Candidate','Job','Experience','Skills','Location','Notice','Expected CTC','Resume','Stage','Your status'],S.applications.sort((a,b)=>ms(b.updatedAt)-ms(a.updatedAt)).map(a=>{const s=a.shared||{};return`<tr data-a="review" data-id="${a.id}"><td><b>${esc(s.name)}</b></td><td>${esc(by(S.jobs,a.jobId).title)}</td><td>${esc(s.experience)}</td><td>${esc(s.skills)}</td><td>${esc(s.location)}</td><td>${esc(s.noticePeriod)}</td><td>${esc(s.expectedCtc)}</td><td>${link(s.resumeLink)}</td><td>${pill(a.stage)}</td><td>${esc(a.clientStatus)}</td></tr>`}),'No candidates have been shared with you yet.'));
};
ACT.review=id=>{const a=by(S.applications,id),s=a.shared||{};
 const{m,close}=modal(s.name||'Candidate',`<div class="sm"><div><span>Job</span><br>${esc(by(S.jobs,a.jobId).title)}</div><div><span>Stage</span><br>${pill(a.stage)}</div><div><span>Experience</span><br>${esc(s.experience)}</div><div><span>Notice period</span><br>${esc(s.noticePeriod)}</div><div><span>Location</span><br>${esc(s.location)}</div><div><span>Expected CTC</span><br>${esc(s.expectedCtc)}</div><div class="full"><span>Skills</span><br>${esc(s.skills)}</div><div class="full"><span>Note from Hiretalnexa</span><br>${esc(s.note)||'-'}</div><div><span>Resume</span><br>${link(s.resumeLink)||'-'}</div></div>
 <form id="mf"><div class="fg"><label class="full">Your decision<select id="cs"><option value="">Not decided</option>${CS.map(x=>`<option ${x===a.clientStatus?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="full">Feedback for Hiretalnexa<textarea id="fb" rows="3" maxlength="500">${esc(a.clientFeedback)}</textarea></label></div><div class="mf"><button type="button" class="bt ghost" id="cx">Close</button><button class="bt" type="submit">Save</button></div></form>`,1);
 $('#cx',m).onclick=close;$('#mf',m).onsubmit=async e=>{e.preventDefault();const fb=$('#fb',m).value;if(fb&&!fb.trim()){toast('Feedback cannot contain only spaces.',true);return}
  await busy($('button[type=submit]',m),async()=>{try{await updateDoc(doc(db,'applications',id),{clientStatus:$('#cs',m).value,clientFeedback:fb.trim(),clientUpdatedAt:serverTimestamp()});await loadClient();close();toast('Saved');VIEWS.ccands()}catch(x){toast(errText(x),true)}})}};

/* ---------- boot ---------- */
async function loadClient(){const cid=S.profile.clientId;
 const[cl,j,a]=await Promise.all([getDoc(doc(db,'clients',cid)),getDocs(query(collection(db,'jobs'),where('clientId','==',cid))),getDocs(query(collection(db,'applications'),where('clientId','==',cid),where('sharedWithClient','==',true)))]);
 S.myClient=cl.exists()?cl.data():{};S.jobs=j.docs.map(d=>({id:d.id,...d.data()}));S.applications=a.docs.map(d=>({id:d.id,...d.data()}))}
onAuthStateChanged(auth,async u=>{
 if(!u){S.user=null;S.profile=null;S.view='';renderLogin();return}
 S.user=u;root().innerHTML='<div class="lg"><div class="cn"><p>Loading...</p></div></div>';
 try{const p=await getDoc(doc(db,'users',u.uid));
  if(!p.exists()||!['admin','user','client'].includes(p.data().role)||(p.data().role==='client'&&!p.data().clientId)){renderBlock('No access yet','Your login is not linked to a role. Please contact Hiretalnexa to get access.');return}
  S.profile=p.data();
  if(S.profile.role==='client')await loadClient();else await Promise.all(['clients','jobs','candidates','applications',...(isAdm()?['users']:[])].map(load));
  shell()}
 catch(e){renderBlock('Could not load',errText(e))}
});
let idle;const bump=()=>{clearTimeout(idle);if(auth.currentUser)idle=setTimeout(()=>signOut(auth),30*60*1000)};
['click','keydown','mousemove','touchstart'].forEach(ev=>addEventListener(ev,bump,{passive:true}));

</script>
</body>
</html>
